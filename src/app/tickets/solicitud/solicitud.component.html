<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Ticket Creation
  </title>
  <script src="">
  </script>
  <link href="" rel="stylesheet"/>
 </head>
<body class="bg-gray-100 m-0">
  <div class="min-h-screen bg-gray-100">
    <!-- Vista inicial: lista de templates -->
    <div *ngIf="!otroTicket" class="w-full max-w-4xl mx-auto p-6">
      <div class="bg-white rounded shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Seleccione el tipo de solicitud a crear</h1>
        <div class="mb-6">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            placeholder="Buscar por título o área..."
            class="w-full border border-gray-300 p-2 rounded shadow-sm"
          />
        </div>

        <div *ngFor="let template of templatesPaginados; let i = index">
          <button
            class="w-full bg-gray-100 hover:bg-gray-200 transition text-left p-4 mb-2 rounded text-gray-800 shadow-sm"
            (click)="irOtroTemplate(template)"
          >
            <div>
              <div class="font-semibold text-base">{{ template.titulo }}</div>
              <div class="text-sm text-gray-500 mt-1">{{ template.areaResponsable }}</div>
            </div>
          </button>
        </div>
        
        
        <div class="flex justify-between items-center mt-4 text-sm text-gray-700">
          <button
            class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded disabled:opacity-50"
            (click)="cambiarPagina('anterior')"
            [disabled]="paginaActual === 1"
          >
            ← Anterior
          </button>
        
          <span>Página {{ paginaActual }} de {{ totalPaginas }}</span>
        
          <button
            class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded disabled:opacity-50"
            (click)="cambiarPagina('siguiente')"
            [disabled]="paginaActual === totalPaginas"
          >
            Siguiente →
          </button>
        </div>
        
      </div>
    </div>

    <!-- Formulario activo -->
    <div *ngIf="otroTicket" class="w-full max-w-2xl mx-auto py-10">
      <div class="bg-white rounded shadow-md p-8">
        <div class="flex justify-between items-start mb-2">
          <!-- Izquierda: título + área responsable -->
          <div>
            <h2 class="text-2xl font-bold text-gray-800">{{ titulo }}</h2>
            <div class="text-sm text-gray-500 mt-1">{{ areaResponsable }}</div>
          </div>
        
          <!-- Derecha: botón de cerrar -->
          <button class="text-red-600 text-xl" (click)="otroTicket = false">✕</button>
        </div>
        

        <form [formGroup]="formOtroTicket" (ngSubmit)="guardarOtroTicket()" class="space-y-6">
          <!-- Asunto -->
          <div>
            <label class="block text-gray-700 font-medium mb-1">Asunto:</label>
            <input
              type="text"
              formControlName="asunto"
              [class.border-red-500]="formIncompleto && formOtroTicket.get('asunto')?.invalid"
              class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <!-- Detalle -->
          <div>
            <label class="block text-gray-700 font-medium mb-1">Detalle:</label>
            <input
              type="text"
              formControlName="detalle"
              [class.border-red-500]="formIncompleto && formOtroTicket.get('asunto')?.invalid"
              class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            />
          </div>

          <!-- Prioridad -->
          <div>
            <label class="block text-gray-700 font-medium mb-1">Prioridad:</label>
            <select
              formControlName="prioridad"
              [class.border-red-500]="formIncompleto && formOtroTicket.get('asunto')?.invalid"
              class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
            >
              <option value="Baja">Baja</option>
              <option value="Media">Media</option>
              <option value="Alta">Alta</option>
            </select>
          </div>

          <!-- Campos personalizados -->
          <div formArrayName="campos" class="space-y-6">
            <div
              *ngFor="let grupo of campos.controls; let i = index; trackBy: trackByIndex"
              [formGroupName]="i"
              class="space-y-2"
            >
              <ng-container [ngSwitch]="grupo.get('tipo')?.value">

                <!-- Input -->
                <ng-container *ngSwitchCase="'input'">
                  <div>
                    <label class="block text-gray-700 font-medium mb-1">
                      {{ grupo.get('nombre')?.value || 'Campo de texto' }}:
                    </label>
                    <input
                      formControlName="valor"
                      class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
                    />
                  </div>
                </ng-container>

                <!-- Desplegable -->
                <ng-container *ngSwitchCase="'desplegable'">
                  <div>
                    <label class="block text-gray-700 font-medium mb-1">
                      {{ grupo.get('nombre')?.value || 'Seleccione una opción' }}:
                    </label>
                    <select
                      formControlName="seleccion"
                      class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                      <option value="" disabled hidden>Seleccione una opción</option>
                      <ng-container formArrayName="opciones">
                        <option *ngFor="let opt of getCampoOpciones(i).controls" [value]="opt.value">
                          {{ opt.value }}
                        </option>
                      </ng-container>
                    </select>
                  </div>
                </ng-container>

                <!-- Radio -->
                <ng-container *ngSwitchCase="'radio'">
                  <div>
                    <label class="block text-gray-700 font-medium mb-1">
                      {{ grupo.get('nombre')?.value || 'Seleccione una opción' }}:
                    </label>
                    <div formArrayName="opciones" class="space-y-2 pl-1">
                      <label
                        *ngFor="let opt of getCampoOpciones(i).controls; let j = index"
                        class="flex items-center gap-2"
                      >
                        <input
                          type="radio"
                          [value]="opt.value"
                          [name]="'radioGroup' + i"
                          [checked]="grupo.get('seleccion')?.value === opt.value"
                          (change)="onSeleccionarRadio(i, opt.value)"
                          class="text-red-600 focus:ring-red-500"
                        />
                        <span>{{ opt.value || 'Opción sin nombre' }}</span>
                      </label>
                    </div>
                  </div>
                </ng-container>

              </ng-container>
            </div>
          </div>

          <div *ngIf="formIncompleto" class="text-red-600 font-medium mb-4">
            ⚠ Por favor, completá todos los campos requeridos.
          </div>

          <!-- Botones -->
          <div class="flex justify-end gap-4 pt-4">
            <button
              type="button"
              class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition"
              (click)="otroTicket = false"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="bg-red-700 text-white px-6 py-2 rounded hover:bg-red-800 transition"
            >
              Aceptar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
