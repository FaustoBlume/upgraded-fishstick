<h2 mat-dialog-title class="error-title text-center font-bold bg-red-700">¡Error!</h2>
<div mat-dialog-content>
    <p class="error-message">El usuario o la contraseña es incorrecto/a.</p>
</div>
<div mat-dialog-actions class="flex justify-center">
    <button mat-button mat-dialog-close
    class="bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded flex items-center justify-center gap-2 transition-all 
            focus:outline-none focus-visible:ring-2 focus-visible:ring-black">
              <span>Aceptar</span>
          </button>
</div>
